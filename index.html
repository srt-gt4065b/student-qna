<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIM Assistant Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  /* ============================================================
     ★ 설정 (n8n Webhook 노드의 Production URL을 넣으세요)
     - WEBHOOK_URL  : 질문 → AI 답변/교수님 이메일 워크플로우
     - FEEDBACK_URL : 평가·의견 저장용 워크플로우 (Webhook → 구글드라이브/시트 저장)
     ============================================================ */
  const WEBHOOK_URL  = "https://gt4065b.zeabur.app/webhook/student-qna";
  const FEEDBACK_URL = "https://gt4065b.zeabur.app/webhook/student-feedback";
  const PROFESSOR = { en: "Prof. Hyoungtae Kim", ko: "김형태 교수", zh: "金亨泰教授" };
</script>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --ink: #1c2233; --muted: #6b7489;
    --line: #dfe3ec; --brand: #3056d3; --brand-soft: #eaf0ff;
    --ai: #f3f6ff; --mail: #fff7e8; --mail-line: #f0d49a; --danger: #d64545; --ok: #1f9d63;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141c; --card: #1a1f2b; --ink: #e8ebf3; --muted: #9aa3b8;
      --line: #2a3142; --brand: #6d8bff; --brand-soft: #232c45;
      --ai: #1f2740; --mail: #2c2618; --mail-line: #5a4a26; --danger: #ff7b7b; --ok: #4fd08f;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', 'Noto Sans SC', system-ui, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh; line-height: 1.6;
  }
  html[lang="zh"] body { font-family: 'Noto Sans SC', 'Noto Sans KR', system-ui, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }

  .top { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button {
    font: inherit; font-size: 13px; font-weight: 500; background: transparent;
    color: var(--muted); border: none; border-radius: 999px; padding: 5px 14px; cursor: pointer;
  }
  .seg button.on { background: var(--brand); color: #fff; }

  h1 { font-size: 24px; font-weight: 700; text-align: center; margin: 8px 0 22px; }

  section { margin-bottom: 22px; }
  .label { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: block; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .who-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .who-row .seg { background: var(--bg); }
  .idgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .idgrid .full { grid-column: 1 / -1; }

  input, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--card);
    border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--brand); }
  textarea { resize: vertical; }
  #question { min-height: 130px; }
  #comment { min-height: 90px; }

  .btn {
    width: 100%; font: inherit; font-weight: 700; font-size: 15px; margin-top: 10px;
    background: var(--brand); color: #fff; border: none; border-radius: 12px; padding: 13px; cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }

  .answer {
    min-height: 130px; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 14px; background: var(--card); white-space: pre-wrap; word-break: break-word;
  }
  .answer.empty { color: var(--muted); display: flex; align-items: center; justify-content: center; text-align: center; }
  .answer.ai { background: var(--ai); }
  .answer.mail { background: var(--mail); border-color: var(--mail-line); }
  .answer .tag { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .typing span { display: inline-block; width: 8px; height: 8px; margin: 0 3px; background: var(--muted); border-radius: 50%; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .2 } 40% { opacity: 1 } }

  .rating { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; background: var(--card); }
  .rating label {
    display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
    padding: 8px 4px; border-radius: 10px; font-size: 13px; font-weight: 500; text-align: center;
  }
  .rating input { display: none; }
  .rating .emo { font-size: 22px; line-height: 1.2; }
  .rating label:has(input:checked) { background: var(--brand-soft); color: var(--brand); }
  fieldset:disabled { opacity: .45; }
  fieldset { border: none; }

  .msg { font-size: 13px; margin-top: 8px; display: none; }
  .msg.err { color: var(--danger); display: block; }
  .msg.ok { color: var(--ok); display: block; }

  @media (max-width: 420px) {
    .idgrid { grid-template-columns: 1fr; }
    .rating { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="seg" id="langSeg">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
  </div>

  <h1 data-i18n="welcome"></h1>

  <!-- ① 질문 -->
  <section>
    <div class="who-row">
      <span class="label" style="margin:0" data-i18n="qLabel"></span>
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="anon" data-i18n="anon"></button>
        <button type="button" data-mode="named" data-i18n="named"></button>
      </div>
    </div>

    <div class="idgrid" id="namedFields">
      <input id="name" autocomplete="name" data-i18n-ph="namePh">
      <input id="sid" inputmode="numeric" data-i18n-ph="sidPh">
    </div>
    <div class="idgrid">
      <input id="email" class="full" type="email" autocomplete="email" data-i18n-ph="emailPh">
    </div>

    <textarea id="question" data-i18n-ph="qPh"></textarea>
    <div class="sub" id="modeHint"></div>
    <button class="btn" id="askBtn" type="button" data-i18n="ask"></button>
    <div class="msg" id="askMsg"></div>
  </section>

  <!-- ② 답변 -->
  <section>
    <span class="label" data-i18n="aLabel"></span>
    <div class="answer empty" id="answer"></div>
  </section>

  <!-- ③ 평가 + 기타 의견 -->
  <fieldset id="evalBox" disabled>
    <section>
      <span class="label" data-i18n="evalLabel"></span>
      <div class="rating">
        <label><input type="radio" name="rating" value="very_good"><span class="emo">😄</span><span data-i18n="r1"></span></label>
        <label><input type="radio" name="rating" value="good"><span class="emo">🙂</span><span data-i18n="r2"></span></label>
        <label><input type="radio" name="rating" value="ok"><span class="emo">😐</span><span data-i18n="r3"></span></label>
        <label><input type="radio" name="rating" value="poor"><span class="emo">🙁</span><span data-i18n="r4"></span></label>
      </div>
    </section>
    <section>
      <span class="label" data-i18n="cLabel"></span>
      <textarea id="comment" data-i18n-ph="cPh"></textarea>
      <button class="btn" id="evalBtn" type="button" data-i18n="submitEval"></button>
      <div class="msg" id="evalMsg"></div>
    </section>
  </fieldset>

  <button class="btn ghost" id="newBtn" type="button" style="display:none" data-i18n="newQ"></button>
</div>

<script>
  const T = {
    en: {
      welcome: "Welcome to AIM Assistant Service!",
      qLabel: "Your Question / Difficulties / Situation",
      anon: "Anonymous", named: "With my name",
      namePh: "Name", sidPh: "Student ID", emailPh: "Email (optional — to receive a reply from the professor)",
      qPh: "Tell us your question, difficulty or situation freely.",
      hintAnon: "You are asking anonymously. Leave an email only if you want a reply from the professor.",
      hintNamed: "Your name and student ID will be shared with the professor.",
      ask: "Send", asking: "Preparing your answer…",
      aLabel: "Answer",
      aEmpty: "The answer will appear here.",
      ai: "🤖 AIM Assistant",
      fwd: "📧 Forwarded to the professor",
      fwdMail: (p, e) => `This question needs ${p}'s personal attention, so it has been forwarded.\nThe reply will be sent to ${e}.`,
      fwdNoMail: p => `This question has been forwarded to ${p}.\nSince no email was given, a personal reply can't be sent. Add your email and send again if you'd like one.`,
      evalLabel: "Evaluate Service",
      r1: "Very Good", r2: "Good", r3: "OK", r4: "Poor",
      cLabel: "Other Comments",
      cPh: "Any suggestions or comments (optional)",
      submitEval: "Submit evaluation",
      newQ: "Ask another question",
      errQ: "Please write your question.",
      errNamed: "Please enter your name and student ID, or choose Anonymous.",
      errEmail: "Please check your email address.",
      errSend: "Could not send. Please try again shortly.",
      errRate: "Please choose a rating.",
      thanks: "Thank you for your feedback!"
    },
    ko: {
      welcome: "AIM 상담 서비스에 오신 것을 환영합니다!",
      qLabel: "질문 / 어려운 점 / 상황",
      anon: "무기명", named: "기명",
      namePh: "이름", sidPh: "학번", emailPh: "이메일 (선택 — 교수님 답변을 받으려면 입력)",
      qPh: "궁금한 점, 어려운 점, 처한 상황을 편하게 적어 주세요.",
      hintAnon: "무기명으로 질문합니다. 교수님 답변을 받고 싶을 때만 이메일을 남겨 주세요.",
      hintNamed: "이름과 학번이 교수님께 함께 전달됩니다.",
      ask: "보내기", asking: "답변을 준비하고 있어요…",
      aLabel: "답변",
      aEmpty: "여기에 답변이 표시됩니다.",
      ai: "🤖 AIM 상담봇",
      fwd: "📧 교수님께 전달됨",
      fwdMail: (p, e) => `이 질문은 ${p}께서 직접 확인하실 내용이라 전달해 두었어요.\n답변은 ${e} 으로 보내드릴게요.`,
      fwdNoMail: p => `이 질문은 ${p}께 전달되었어요.\n이메일이 없어 개별 답장은 어려워요. 답장을 원하면 이메일을 적고 다시 보내 주세요.`,
      evalLabel: "서비스 평가",
      r1: "매우 좋음", r2: "좋음", r3: "보통", r4: "부족",
      cLabel: "기타 의견",
      cPh: "건의사항이나 하고 싶은 말 (선택)",
      submitEval: "평가 제출",
      newQ: "새 질문하기",
      errQ: "질문을 적어 주세요.",
      errNamed: "이름과 학번을 입력하거나 무기명을 선택해 주세요.",
      errEmail: "이메일 주소 형식을 확인해 주세요.",
      errSend: "보내지 못했어요. 잠시 후 다시 시도해 주세요.",
      errRate: "평가를 선택해 주세요.",
      thanks: "소중한 의견 감사합니다!"
    },
    zh: {
      welcome: "欢迎使用 AIM 咨询服务！",
      qLabel: "你的问题 / 困难 / 情况",
      anon: "匿名", named: "实名",
      namePh: "姓名", sidPh: "学号", emailPh: "电子邮箱（选填 — 如需教授回复请填写）",
      qPh: "请自由写下你的问题、困难或目前的情况。",
      hintAnon: "你正在匿名提问。只有需要教授回复时才请留下邮箱。",
      hintNamed: "你的姓名和学号将一并转交给教授。",
      ask: "发送", asking: "正在准备回答…",
      aLabel: "回答",
      aEmpty: "回答将显示在这里。",
      ai: "🤖 AIM 助手",
      fwd: "📧 已转交教授",
      fwdMail: (p, e) => `这个问题需要${p}亲自查看，已为你转交。\n回复将发送至 ${e}。`,
      fwdNoMail: p => `这个问题已转交给${p}。\n由于没有填写邮箱，无法单独回复。如需回复，请填写邮箱后重新发送。`,
      evalLabel: "服务评价",
      r1: "非常好", r2: "好", r3: "一般", r4: "差",
      cLabel: "其他意见",
      cPh: "建议或想说的话（选填）",
      submitEval: "提交评价",
      newQ: "再问一个问题",
      errQ: "请填写你的问题。",
      errNamed: "请填写姓名和学号，或选择匿名。",
      errEmail: "请检查电子邮箱格式。",
      errSend: "发送失败，请稍后再试。",
      errRate: "请选择评价。",
      thanks: "感谢你的反馈！"
    }
  };

  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let lang = (() => {
    const s = store.get('lang'); if (T[s]) return s;
    const b = (navigator.language || 'en').toLowerCase();
    return b.startsWith('ko') ? 'ko' : b.startsWith('zh') ? 'zh' : 'en';
  })();
  let mode = store.get('mode') === 'named' ? 'named' : 'anon';
  let current = null;   // 현재 질문 정보 (평가와 연결하기 위해 보관)
  let answerState = { kind: 'empty' };

  function newId() {
    return 'Q' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
  }
  function msg(el, text, kind) { el.textContent = text || ''; el.className = 'msg' + (kind ? ' ' + kind : ''); }

  function renderAnswer() {
    const t = T[lang], box = $('answer'), s = answerState;
    box.className = 'answer';
    if (s.kind === 'empty') { box.classList.add('empty'); box.textContent = t.aEmpty; return; }
    if (s.kind === 'wait') { box.classList.add('empty'); box.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; return; }
    const tag = document.createElement('div'); tag.className = 'tag';
    const body = document.createElement('div');
    if (s.kind === 'ai') {
      box.classList.add('ai'); tag.textContent = t.ai; body.textContent = s.text;
    } else {
      box.classList.add('mail'); tag.textContent = t.fwd;
      const p = PROFESSOR[lang];
      body.textContent = (s.text ? s.text + '\n\n' : '') + (s.email ? t.fwdMail(p, s.email) : t.fwdNoMail(p));
    }
    box.replaceChildren(tag, body);
  }

  function applyMode(m) {
    mode = m; store.set('mode', m);
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    $('namedFields').style.display = m === 'named' ? '' : 'none';
    $('modeHint').textContent = T[lang][m === 'named' ? 'hintNamed' : 'hintAnon'];
  }

  function applyLang(l) {
    lang = l; store.set('lang', l);
    const t = T[l];
    document.documentElement.lang = l;
    document.title = t.welcome.replace('!', '').replace('！', '');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t[el.dataset.i18nPh]; });
    document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
    if ($('askBtn').disabled && answerState.kind === 'wait') $('askBtn').textContent = t.asking;
    applyMode(mode);
    renderAnswer();
  }

  document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => applyLang(b.dataset.lang));
  document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => applyMode(b.dataset.mode));

  // 기명일 때 입력했던 이름·학번·이메일은 다음 방문 때 자동 입력
  try {
    const saved = JSON.parse(store.get('student') || '{}');
    ['name', 'sid', 'email'].forEach(k => { if (saved[k]) $(k).value = saved[k]; });
  } catch (e) {}

  // n8n 응답 해석 (여러 형태 허용)
  function parseReply(raw) {
    let d;
    try { d = JSON.parse(raw); } catch (e) { return { escalated: !raw.trim(), text: raw.trim() }; }
    if (Array.isArray(d)) d = d[0] || {};
    if (d && d.json) d = d.json;
    const text = String(d.answer ?? d.output ?? d.reply ?? d.text ?? d.message ?? '').trim();
    const flag = String(d.type ?? d.route ?? d.status ?? '').toLowerCase();
    const escalated = d.escalated === true || d.needsProfessor === true ||
      ['email', 'escalate', 'escalated', 'professor', 'forwarded'].includes(flag) || !text;
    return { escalated, text };
  }

  $('askBtn').onclick = async () => {
    const t = T[lang];
    msg($('askMsg'));
    const question = $('question').value.trim();
    const name = $('name').value.trim(), sid = $('sid').value.trim(), email = $('email').value.trim();

    if (!question) return msg($('askMsg'), t.errQ, 'err');
    if (mode === 'named' && (!name || !sid)) return msg($('askMsg'), t.errNamed, 'err');
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg($('askMsg'), t.errEmail, 'err');
    if (mode === 'named') store.set('student', JSON.stringify({ name, sid, email }));

    current = {
      action: 'question',
      questionId: newId(),
      anonymous: mode === 'anon',
      name: mode === 'named' ? name : '',
      studentId: mode === 'named' ? sid : '',
      email,
      question,
      language: lang,
      submittedAt: new Date().toISOString(),
      source: 'web'
    };

    $('askBtn').disabled = true; $('askBtn').textContent = t.asking;
    answerState = { kind: 'wait' }; renderAnswer();

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(current)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const r = parseReply(await res.text());
      answerState = r.escalated ? { kind: 'mail', text: r.text, email } : { kind: 'ai', text: r.text };
      current.result = r.escalated ? 'email' : 'answer';
      renderAnswer();
      $('evalBox').disabled = false;
      $('question').readOnly = true;
      $('askBtn').style.display = 'none';
    } catch (e) {
      answerState = { kind: 'empty' }; renderAnswer();
      msg($('askMsg'), `${T[lang].errSend} (${e.message})`, 'err');
    } finally {
      $('askBtn').disabled = false; $('askBtn').textContent = T[lang].ask;
    }
  };

  $('evalBtn').onclick = async () => {
    const t = T[lang];
    msg($('evalMsg'));
    const picked = document.querySelector('input[name="rating"]:checked');
    if (!picked) return msg($('evalMsg'), t.errRate, 'err');

    const payload = {
      action: 'feedback',
      questionId: current ? current.questionId : '',
      anonymous: current ? current.anonymous : true,
      studentId: current ? current.studentId : '',
      result: current ? current.result : '',
      rating: picked.value,
      comment: $('comment').value.trim(),
      language: lang,
      submittedAt: new Date().toISOString()
    };
    $('evalBtn').disabled = true;
    try {
      const res = await fetch(FEEDBACK_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      msg($('evalMsg'), t.thanks, 'ok');
      $('evalBtn').style.display = 'none';
      $('evalBox').querySelectorAll('input, textarea').forEach(el => el.disabled = true);
      $('newBtn').style.display = '';
    } catch (e) {
      msg($('evalMsg'), `${t.errSend} (${e.message})`, 'err');
      $('evalBtn').disabled = false;
    }
  };

  $('newBtn').onclick = () => {
    current = null; answerState = { kind: 'empty' }; renderAnswer();
    $('question').value = ''; $('question').readOnly = false;
    $('comment').value = '';
    document.querySelectorAll('input[name="rating"]').forEach(r => r.checked = false);
    $('evalBox').querySelectorAll('input, textarea').forEach(el => el.disabled = false);
    $('evalBox').disabled = true;
    $('evalBtn').style.display = ''; $('evalBtn').disabled = false;
    $('askBtn').style.display = '';
    $('newBtn').style.display = 'none';
    msg($('askMsg')); msg($('evalMsg'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
    $('question').focus();
  };

  applyLang(lang);
</script>
</body>
</html>
